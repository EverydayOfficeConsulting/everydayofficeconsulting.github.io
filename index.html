<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOCO Tools</title>
<style>
:root {
  --brand: #3A506B; --header: #1C2541; --accent: #8DA9C4; --bg: #F0F4F8;
  --panel: #FFFFFF; --text: #1F2A3A; --muted: #5B6B80; --line: #D1D9E6;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
header { background: var(--header); color: #fff; text-align: center; padding: 56px 20px 64px; }
.brand { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: 6px; text-transform: uppercase; }
.tagline { margin: 8px 0 0; color: var(--accent); font-size: .78rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
.intro { margin: 22px auto 0; max-width: 560px; color: rgba(255,255,255,.82); font-size: 1.02rem; }
main { flex: 1; width: 100%; max-width: 980px; margin: -32px auto 0; padding: 0 20px 60px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 320px)); justify-content: center; gap: 18px; }
.tool {
  display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit;
  background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--brand);
  border-radius: 6px; padding: 24px 22px 20px; box-shadow: 0 4px 14px rgba(28,37,65,.07);
  transition: transform .2s cubic-bezier(.2,1,.3,1), box-shadow .2s;
}
.tool:hover, .tool:focus-visible { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(28,37,65,.14); outline: none; }
.tool-icon { font-size: 1.7rem; line-height: 1; }
.tool h2 { margin: 0; font-size: 1.15rem; font-weight: 800; }
.tool p { margin: 0; color: var(--muted); font-size: .93rem; flex: 1; }
.open { color: var(--brand); font-weight: 800; font-size: .78rem; letter-spacing: 1px; text-transform: uppercase; margin-top: 6px; }
.empty { text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 6px; padding: 40px 20px; }
footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 20px 28px; }
footer a { color: var(--muted); margin-left: 10px; }
@media (max-width: 600px) { header { padding: 40px 16px 56px; } .brand { font-size: 1.6rem; letter-spacing: 4px; } }
@media (prefers-reduced-motion: reduce) { .tool { transition: none; } }
</style>
</head>
<body>
<header>
  <h1 class="brand" id="hub-title">EOCO Tools</h1>
  <p class="tagline" id="hub-tagline">Simple Systems. Better Business.</p>
  <p class="intro" id="hub-intro"></p>
</header>
<main><div class="grid" id="tools"></div></main>
<footer><span id="hub-footer"></span><a id="admin-link" href="admin/">Admin</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="platform/tools.js"></script>
<script>
const HUB_DEFAULTS = {
  title: 'EOCO Tools',
  tagline: 'Simple Systems. Better Business.',
  intro: 'Practical tools to help you set up and run your business.',
  footer: '© 2026 EOCO - Nova Scotia',
  show_admin_link: true,
  colors: { brand: '#3A506B', header: '#1C2541', accent: '#8DA9C4', background: '#F0F4F8' },
  tools: {}
};
const PREVIEW = new URLSearchParams(location.search).has('preview');
let previewOverride = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function merge(base, over) {
  const out = { ...base };
  if (!over || typeof over !== 'object') return out;
  Object.keys(over).forEach(k => {
    const b = base ? base[k] : undefined, o = over[k];
    if (o && typeof o === 'object' && !Array.isArray(o) && b && typeof b === 'object') out[k] = merge(b, o);
    else if (o !== undefined && o !== null) out[k] = o;
  });
  return out;
}

function render(raw) {
  const s = merge(HUB_DEFAULTS, raw || {});
  const hex = v => /^#[0-9a-f]{3,8}$/i.test(v || '');
  Object.entries({ brand: '--brand', header: '--header', accent: '--accent', background: '--bg' })
    .forEach(([k, v]) => { if (hex(s.colors[k])) document.documentElement.style.setProperty(v, s.colors[k]); });
  document.title = s.title;
  $('hub-title').textContent = s.title;
  $('hub-tagline').textContent = s.tagline;
  $('hub-intro').textContent = s.intro;
  $('hub-footer').textContent = s.footer;
  $('admin-link').hidden = !s.show_admin_link;
  const opts = id => (s.tools && s.tools[id]) || {};
  const list = (window.EOCO_TOOLS || [])
    .map((t, i) => ({ t, o: opts(t.id), i }))
    .filter(x => x.o.visible !== false)
    .sort((a, b) => ((a.o.order ?? a.i) - (b.o.order ?? b.i)));
  $('tools').innerHTML = list.length ? list.map(({ t, o }) => `
    <a class="tool" href="${esc(t.path)}">
      <span class="tool-icon" aria-hidden="true">${esc(t.icon || '')}</span>
      <h2>${esc(t.name)}</h2>
      <p>${esc(o.summary || t.summary || '')}</p>
      <span class="open">Open tool →</span>
    </a>`).join('') : '<div class="empty">No tools to show yet.</div>';
}

try { render(JSON.parse(localStorage.getItem('eoco_hub_settings') || 'null')); } catch (e) { render(null); }

(async function load() {
  const cfg = window.EOCO_CONFIG || {};
  if (!cfg.SUPABASE_URL || !window.supabase) return;
  try {
    const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    const { data } = await sb.from('tool_settings').select('settings').eq('tool_id', 'hub').maybeSingle();
    if (data && !(PREVIEW && previewOverride)) {
      if (!PREVIEW) localStorage.setItem('eoco_hub_settings', JSON.stringify(data.settings || {}));
      render(data.settings);
    }
  } catch (e) {}
})();

window.addEventListener('message', e => {
  if (!PREVIEW || e.origin !== location.origin || !e.data || e.data.type !== 'eoco-hub-preview') return;
  previewOverride = e.data.settings; render(previewOverride);
});
</script>
</body>
</html>
